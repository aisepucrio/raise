# Raise: the Go backend (backend-go/) and the frontend (frontend/).
#
#   cp .env.example .env    # then set ENCRYPTION_KEYS (cd backend-go && make keygen)
#                           # and ADMIN_PASSWORD, the first admin's password
#   docker compose up --build
#
# The API listens on :8000 and the frontend dev server on :5173, which proxies
# /api/ to the API so the browser uses one origin. With
# `--profile production`, nginx also serves the frontend build and proxies
# /api/ on :8080. This file is for development: the database uses fixed
# credentials and its port is published. See backend-go/README.md#production.
name: raise

x-backend: &backend
  build: ./backend-go
  env_file: .env
  environment:
    DATABASE_URL: postgres://raise:raise@db:5432/raise?sslmode=disable
    GIT_MIRROR_DIR: /data/mirrors
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: raise
      POSTGRES_USER: raise
      POSTGRES_PASSWORD: raise
    # 5433 avoids clashing with a Postgres already running on the host.
    ports: ["5433:5432"]
    volumes: [pg:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "raise"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  migrate:
    build: ./backend-go
    command: ["raisectl", "migrate", "up"]
    environment:
      DATABASE_URL: postgres://raise:raise@db:5432/raise?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: ["api"]
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: ["worker"]
    volumes: [mirrors:/data/mirrors]

  frontend:
    build: ./frontend
    # Only what the frontend needs: .env also holds the backend's secrets.
    environment:
      IS_DEBUG: ${IS_DEBUG:-True}
      # The Vite dev server proxies /api/ here, so the browser stays on :5173.
      API_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    volumes: [frontend_dist:/app/dist]
    depends_on: [api]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - frontend_dist:/app/dist
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports: ["8080:8080"]
    depends_on: [api, frontend]
    profiles: [production]
    restart: unless-stopped

volumes:
  pg:
  mirrors:
  frontend_dist:
